# OBIS (IEC 62056-6-1:2023, Edition 4.0, 2023-12; EN IEC 62056-6-1:2024 is
# the same text, endorsed without modification) as data: the value group
# tables, the reserved, manufacturer, utility, consortia and country ranges,
# and the standard object codes of the abstract and electricity tables.
# Transcribed as facts (numbers, ranges, country names) from a licensed copy
# with clause and table references,
# with the COSEM objects and interface classes (ic) of IEC 62056-6-2:2023
# clause 6 (rows with t "6-2 <clause>").
# Every name and label is our own short wording, not the standard's: names
# are the camel-case point names SigmaM2M derives, labels are a few words
# for a person reading a description. Source defects: F-262 to F-264, F-266 to F-268
# (SigmaM2M finding numbers; see PROVENANCE.md).
#
# Value sets: "3", "0-9", "1,4-9,15", "*" (any). An object row's e or f
# left out means the group is not used (255). f: bill means a billing
# period code (0-99, 101-126) or 255 (5.6.2, 7.4.1, A.3).
# Name templates: {e} the value of E, {e+N} / {e-N} E shifted, {E} empty
# when E is 0 and "E<e>" otherwise.
source: "IEC 62056-6-1:2023"

# 5.1 Table 3: media.
a:
  - {v: "0", key: abstract, label: "abstract objects"}
  - {v: "1", key: electricity, label: "electricity"}
  - {v: "4", key: heatCostAllocator, label: "heat cost allocator"}
  - {v: "5", key: cooling, label: "thermal energy, cooling"}   # EN 13757-1:2021 Table 12
  - {v: "6", key: heat, label: "thermal energy, heat"}
  - {v: "7", key: gas, label: "gas"}
  - {v: "8", key: coldWater, label: "cold water"}
  - {v: "9", key: hotWater, label: "hot water"}
  - {v: "15", key: otherMedia, label: "other media"}

# 5.2 Table 4: channel.
b:
  - {v: "0", key: none, label: "no channel"}
  - {v: "1-64", key: channel, label: "channel"}
  - {v: "65-127", key: utility, label: "utility specific"}
  - {v: "128-199", key: manufacturer, label: "manufacturer specific"}

# 4.2: manufacturer specific ranges per group (any one makes the whole code
# manufacturer specific); Table 2 row 1 applies them for A = 0, 1, 4-9, 15.
manufacturer:
  b: "128-199"
  c: "128-199,240"
  d: "128-254"
  e: "128-254"
  f: "128-254"
# Table 2 rows 2 and 3 (and Tables 8, 20): C = 96, D = 50-99, B = 0-64.
manufacturerGeneral: {a: "0,1,4-9,15", b: "0-64", c: "96", d: "50-99"}
# Table 2 row 4 and 5.2: B = 65-127.
utility: {a: "0,1,4-9,15", b: "65-127"}
# Table 2 rows 5 and 6, 5.4.2 Table 6, 5.4.3 Table 7: C = 93 and 94, D from
# the tables, E and F defined by the consortium or country.
consortia: {a: "0,1,4-9,15", b: "0-64", c: "93"}
country: {a: "0,1,4-9,15", b: "0-64", c: "94"}

