# EN 13757-1:2021 clause 11: the value
# groups of media A 4 to 9. For each medium, quantity groups give the C
# codes, the D table that applies to them and how E is read; F is a
# billing period (11.1.4.8, Table 56) or 255. The medium's objects are the
# rows with t "EN <table>" in objects below. Names are ours; {m} in an
# object name is the medium prefix. Source defects: F-1200 to F-1207.
media:
  - a: "4"
    prefix: hca
    ref: "11.3.2"
    groups:
      - d: hca
        e: rates9
        c:
          - {c: 1, q: UnratedIntegral, label: "unrated integral"}
          - {c: 2, q: RatedIntegral, label: "rated integral"}
          - {c: 3, q: RadiatorTemperature, label: "radiator surface temperature"}
          - {c: 4, q: HeatingMediumTemperature, label: "heating medium temperature"}
          - {c: 5, q: FlowTemperature, label: "flow temperature"}
          - {c: 6, q: ReturnTemperature, label: "return temperature"}
          - {c: 7, q: RoomTemperature, label: "room temperature"}
  - a: "5"
    prefix: cooling
    ref: "11.3.3"
    groups: &thermal
      - d: thermal
        e: rates9
        c:
          - {c: 1, q: Energy, label: "energy"}
          - {c: 2, q: Volume, label: "volume"}
          - {c: 3, q: Mass, label: "mass"}
          - {c: 4, q: FlowVolume, label: "inlet (flow) volume"}
          - {c: 5, q: FlowMass, label: "inlet (flow) mass"}
          - {c: 6, q: ReturnVolume, label: "outlet (return) volume"}
          - {c: 7, q: ReturnMass, label: "outlet (return) mass"}
          - {c: 8, q: Power, label: "power"}
          - {c: 9, q: FlowRate, label: "flow rate"}
          - {c: 10, q: FlowTemperature, label: "inlet (flow) temperature"}
          - {c: 11, q: ReturnTemperature, label: "outlet (return) temperature"}
          - {c: 12, q: TemperatureDifference, label: "temperature difference"}
          - {c: 13, q: Pressure, label: "pressure"}
  - a: "6"
    prefix: heat
    ref: "11.3.3"
    groups: *thermal
  - a: "7"
    prefix: gas
    ref: "11.3.4"
    groups:
      - d: gasIndex
        e: rates63
        c:
          - {c: 1, q: MeterVolumeFwdUndisturbed, label: "meter volume, forward, undisturbed"}
          - {c: 2, q: MeterVolumeFwdDisturbed, label: "meter volume, forward, disturbed"}
          - {c: 3, q: MeterVolumeFwd, label: "meter volume, forward, absolute"}
          - {c: 4, q: MeterVolumeRevUndisturbed, label: "meter volume, reverse, undisturbed"}
          - {c: 5, q: MeterVolumeRevDisturbed, label: "meter volume, reverse, disturbed"}
          - {c: 6, q: MeterVolumeRev, label: "meter volume, reverse, absolute"}
          - {c: 7, q: EncoderVolumeFwd, label: "meter volume, forward, absolute (encoder)"}
          - {c: 8, q: EncoderVolumeRev, label: "meter volume, reverse, absolute (encoder)"}
          - {c: 11, q: ConverterVolumeFwdUndisturbed, label: "converter volume, forward, undisturbed"}
          - {c: 12, q: ConverterVolumeFwdDisturbed, label: "converter volume, forward, disturbed"}
          - {c: 13, q: ConverterVolumeFwd, label: "converter volume, forward, absolute"}
          - {c: 14, q: ConverterVolumeRevUndisturbed, label: "converter volume, reverse, undisturbed"}
          - {c: 15, q: ConverterVolumeRevDisturbed, label: "converter volume, reverse, disturbed"}
          - {c: 16, q: ConverterVolumeRev, label: "converter volume, reverse, absolute"}
          - {c: 21, q: LoggerVolumeFwdUndisturbed, label: "logger volume, forward, undisturbed"}
          - {c: 22, q: LoggerVolumeFwdDisturbed, label: "logger volume, forward, disturbed"}
          - {c: 23, q: LoggerVolumeFwd, label: "logger volume, forward, absolute"}
          - {c: 24, q: LoggerVolumeRevUndisturbed, label: "logger volume, reverse, undisturbed"}
          - {c: 25, q: LoggerVolumeRevDisturbed, label: "logger volume, reverse, disturbed"}
          - {c: 26, q: LoggerVolumeRev, label: "logger volume, reverse, absolute"}
          - {c: 31, q: EnergyFwdUndisturbed, label: "energy, forward, undisturbed"}
          - {c: 32, q: EnergyFwdDisturbed, label: "energy, forward, disturbed"}
          - {c: 33, q: EnergyFwd, label: "energy, forward, absolute"}
          - {c: 34, q: EnergyRevUndisturbed, label: "energy, reverse, undisturbed"}
          - {c: 35, q: EnergyRevDisturbed, label: "energy, reverse, disturbed"}
          - {c: 36, q: EnergyRev, label: "energy, reverse, absolute"}
          - {c: 61, q: MassFwdUndisturbed, label: "mass, forward, undisturbed"}
          - {c: 62, q: MassFwdDisturbed, label: "mass, forward, disturbed"}
          - {c: 63, q: MassFwd, label: "mass, forward, absolute"}
          - {c: 64, q: MassRevUndisturbed, label: "mass, reverse, undisturbed"}
          - {c: 65, q: MassRevDisturbed, label: "mass, reverse, disturbed"}
          - {c: 66, q: MassRev, label: "mass, reverse, absolute"}
      - d: gasFlow
        e: zero
        c:
          - {c: 43, q: FlowRate, label: "flow rate"}
      - d: gasProcess
        e: zero
        c:
          - {c: 41, q: Temperature, label: "absolute temperature"}
          - {c: 42, q: Pressure, label: "absolute pressure"}
          - {c: 44, q: SoundVelocity, label: "velocity of sound"}
          - {c: 45, q: Density, label: "density of gas"}
          - {c: 46, q: RelativeDensity, label: "relative density"}
          - {c: 47, q: GaugePressure, label: "gauge pressure"}
          - {c: 48, q: DifferentialPressure, label: "differential pressure"}
          - {c: 49, q: AirDensity, label: "density of air"}
      - d: gasConversion
        e: gasAverages
        eByD: {"12": rates63}
        c:
          - {c: 51, q: CorrectionFactor, label: "correction factor"}
          - {c: 52, q: ConversionFactor, label: "conversion factor"}
          - {c: 53, q: CompressibilityFactor, label: "compressibility factor"}
          - {c: 54, q: SuperiorCalorificValue, label: "superior calorific value"}
          - {c: 55, q: GasLawDeviation, label: "gas law deviation coefficient"}
      - d: gasAnalysis
        e: gasAverages
        c:
          - {c: 70, q: "", label: "natural gas analysis"}
  - a: "8"
    prefix: coldWater
    ref: "11.3.5"
    groups: &water
      - d: water
        e: rates9
        c:
          - {c: 1, q: Volume, label: "accumulated volume"}
